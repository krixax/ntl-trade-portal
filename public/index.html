<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Native Traders Limited — Wholesale & Inventory Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#ffffff;--bg-secondary:#F8FAFC;--bg-tertiary:#F1F5F9;
  --text-primary:#1E293B;--text-secondary:#64748B;
  --border-light:#E2E8F0;--border-mid:#CBD5E1;
  --radius-md:8px;--radius-lg:12px;--radius-xl:16px;
  --blue:#1E3A8A;--blue2:#142966;--amber:#B45309;
  --green:#166534;--green-bg:#DCFCE7;
  --purple:#7C3AED;--purple-bg:#F3E8FF;
  --red:#991B1B;--red-bg:#FEE2E2;
  --warn:#92400E;--warn-bg:#FEF3C7;
  --info:#1E40AF;--info-bg:#DBEAFE;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-tertiary);color:var(--text-primary);font-size:13px;height:100vh;display:flex;flex-direction:column}
.shell{display:flex;flex-direction:column;height:100vh;position:relative;overflow:hidden}
.topbar{background:var(--blue);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:50px;flex-shrink:0;z-index:10}
.topbar-logo{display:flex;align-items:center;gap:9px}
.topbar-name{font-size:14px;font-weight:700;color:#fff;letter-spacing:.01em}
.topbar-sub{font-size:9px;color:#93C5FD;text-transform:uppercase;letter-spacing:.1em;margin-top:1px}
.topbar-r{display:flex;align-items:center;gap:7px}
.role-label{font-size:10px;color:#93C5FD;margin-right:2px}
.role-pill{font-size:10px;padding:4px 11px;border-radius:20px;font-weight:600;border:1px solid rgba(255,255,255,.22);color:#fff;cursor:pointer;transition:background .15s;background:transparent}
.role-pill.active{background:rgba(255,255,255,.22)}
.subnav{background:var(--blue2);display:flex;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;overflow-x:auto}
.snav{font-size:10px;color:#93C5FD;padding:10px 13px;border-bottom:2px solid transparent;cursor:pointer;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.snav.on{color:#FCD34D;border-bottom-color:var(--amber)}
.content{flex:1;overflow-y:auto;padding-bottom:80px}
.banner{background:linear-gradient(135deg,var(--blue),var(--blue2) 60%,#1a3a1a);padding:18px 16px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.pad{padding:14px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-light);overflow:hidden}
.pstripe{height:4px}
.ptop{padding:12px}
.pname{font-size:13px;font-weight:700}
.prices{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border-light)}
.pcol{padding:8px 12px}
.pws{font-size:16px;font-weight:700;color:var(--green)}
.pfooter{padding:8px 12px;background:var(--bg-secondary);display:flex;justify-content:space-between;align-items:center}
.obtn{padding:6px 12px;border-radius:6px;border:1.5px solid var(--blue);background:none;color:var(--blue);font-weight:700;cursor:pointer}
.obtn.added{background:var(--green);color:#fff;border-color:var(--green)}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.badge-danger{background:var(--red-bg);color:var(--red)}
.badge-ok{background:var(--green-bg);color:var(--green)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-info{background:var(--info-bg);color:var(--info)}
.price-inp{width:70px;padding:4px;border:1px solid var(--border-mid);border-radius:4px;font-weight:700}
.card{background:#fff;border-radius:var(--radius-lg);border:1px solid var(--border-light);margin-bottom:15px;overflow:hidden}
.incard{width:100%;border-collapse:collapse}
.incard th{text-align:left;padding:10px;background:var(--bg-secondary);font-size:10px;color:var(--text-secondary);text-transform:uppercase}
.incard td{padding:10px;border-bottom:1px solid var(--bg-tertiary)}
.cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;justify-content:flex-end}
.cart-panel{width:320px;background:#fff;height:100%;display:flex;flex-direction:column}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;opacity:0;transition:0.3s;z-index:1000}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="topbar-logo">
      <div class="topbar-name">Native Traders Limited</div>
    </div>
    <div class="topbar-r">
      <button class="role-pill active" id="r-cust" onclick="setRole('customer')">Customer</button>
      <button class="role-pill" id="r-mgr" onclick="setRole('manager')">Manager</button>
      <button class="role-pill" id="r-admin" onclick="setRole('admin')">Admin</button>
    </div>
  </div>
  <div class="subnav" id="subnav"></div>
  <div class="content" id="content"></div>
</div>

<div class="cart-overlay" id="cartOverlay">
  <div class="cart-panel">
    <div class="pad" style="background:var(--blue);color:#fff"><strong>Your Order</strong></div>
    <div id="cartItems" class="pad" style="flex:1;overflow-y:auto"></div>
    <div class="pad" style="border-top:1px solid #eee">
      <div id="cartTotal" style="font-size:16px;font-weight:700;margin-bottom:10px">Total: $0.00</div>
      <button onclick="submitOrder()" style="width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">Confirm & Process Order</button>
      <button onclick="closeCart()" style="width:100%;padding:8px;margin-top:5px;background:none;border:none;color:var(--text-secondary);cursor:pointer">Close</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// LIVE PRODUCT DATA (Integrated with Expiry Tracking)
let PRODUCTS = [
  {id:1, brand:"Al Baker", name:"Chakki 1 Kg", size:"20x1 kg", ws_price:1.56, rrp:1.95, category:"Flour", moq:20, warehouse_qty:250, reorder_point:50, expiry_date:"2026-12-01", bin:"A1-01"},
  {id:2, brand:"Al Baker", name:"Chakki 2 Kg", size:"10x2 kg", ws_price:3.02, rrp:3.78, category:"Flour", moq:10, warehouse_qty:15, reorder_point:20, expiry_date:"2026-05-15", bin:"A1-02"},
  {id:61, brand:"Hungrry", name:"VEG PANEER MOMOS", size:"25gm x14", ws_price:4.11, rrp:5.87, category:"Frozen", moq:1, warehouse_qty:12, reorder_point:20, expiry_date:"2026-04-20", bin:"E-01-02"},
  {id:116, brand:"BC Namkeen", name:"ALL IN ONE", size:"1000g", ws_price:8.75, rrp:10.00, category:"Snacks", moq:1, warehouse_qty:60, reorder_point:15, expiry_date:"2026-08-20", bin:"B-02-01"}
];

let role = 'customer', cart = {}, stockLog = [], orders = [];

const $d = v => '$' + (+v).toFixed(2);
const toast = (m) => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); };

function setRole(r) {
  role = r;
  document.querySelectorAll('.role-pill').forEach(b => b.classList.remove('active'));
  document.getElementById('r-' + (r === 'customer' ? 'cust' : r === 'manager' ? 'mgr' : 'admin')).classList.add('active');
  buildNav();
}

function buildNav() {
  const tabs = { customer: ['Catalogue', 'My Orders'], manager: ['Catalogue', 'Inventory', 'Stock Log'], admin: ['Catalogue', 'Edit Pricing', 'All Orders'] };
  document.getElementById('subnav').innerHTML = tabs[role].map(t => `<div class="snav" onclick="showTab('${t.toLowerCase().replace(/ /g, '_')}', this)">${t}</div>`).join('');
  showTab(tabs[role][0].toLowerCase().replace(/ /g, '_'), document.querySelector('.snav'));
}

function showTab(tab, el) {
  document.querySelectorAll('.snav').forEach(s => s.classList.remove('on'));
  if (el) el.classList.add('on');
  renderContent(tab);
}

function renderContent(tab) {
  const el = document.getElementById('content');
  if (tab === 'catalogue') el.innerHTML = renderCatalogue();
  else if (tab === 'inventory') el.innerHTML = renderInventory();
  else if (tab === 'stock_log') el.innerHTML = renderStockLog();
  else if (tab === 'edit_pricing') el.innerHTML = renderPricing();
  else if (tab === 'my_orders' || tab === 'all_orders') el.innerHTML = renderOrders();
}

function renderCatalogue() {
  return `<div class="banner"><div><h2>Trade Catalogue</h2><p>Wholesale pricing ex GST</p></div><button class="obtn" style="background:#fff" onclick="openCart()">View Cart (${Object.keys(cart).length})</button></div>
          <div class="pad"><div class="grid">${PRODUCTS.map(p => `
    <div class="pcard">
      <div class="pstripe" style="background:#1E3A8A"></div>
      <div class="ptop"><small>${p.brand}</small><div class="pname">${p.name}</div><small>${p.size}</small></div>
      <div class="prices"><div class="pcol"><small>Wholesale</small><div class="pws">${$d(p.ws_price)}</div></div><div class="pcol"><small>RRP</small><div>${$d(p.rrp)}</div></div></div>
      <div class="pfooter"><small>MOQ: ${p.moq}</small><button class="obtn ${cart[p.id] ? 'added' : ''}" onclick="addToCart(${p.id})">${cart[p.id] ? 'In Cart' : 'Order'}</button></div>
    </div>`).join('')}</div></div>`;
}

function renderInventory() {
  return `<div class="pad"><h3>Warehouse Stock Levels</h3><div class="card"><table class="incard"><thead><tr><th>Item</th><th>Bin</th><th>Qty</th><th>Expiry</th><th>Status</th></tr></thead><tbody>
    ${PRODUCTS.map(p => {
      const isShort = (new Date(p.expiry_date) - new Date()) / (1000 * 60 * 60 * 24) < 60;
      return `<tr><td><strong>${p.name}</strong></td><td>${p.bin}</td><td>${p.warehouse_qty}</td><td><span class="badge ${isShort ? 'badge-danger' : 'badge-info'}">${p.expiry_date}</span></td><td><span class="badge ${p.warehouse_qty < p.reorder_point ? 'badge-warn' : 'badge-ok'}">${p.warehouse_qty < p.reorder_point ? 'LOW' : 'OK'}</span></td></tr>`
    }).join('')}</tbody></table></div></div>`;
}

function renderPricing() {
  return `<div class="pad"><h3>Admin Pricing Matrix</h3><div class="card"><table class="incard"><thead><tr><th>Product</th><th>WS Price</th><th>RRP</th><th>Action</th></tr></thead><tbody>
    ${PRODUCTS.map(p => `<tr><td>${p.name}</td><td><input type="number" id="ws-${p.id}" class="price-inp" value="${p.ws_price}"></td><td><input type="number" id="rrp-${p.id}" class="price-inp" value="${p.rrp}"></td><td><button class="obtn" onclick="savePrice(${p.id})">Save</button></td></tr>`).join('')}
  </tbody></table></div></div>`;
}

function renderStockLog() {
  return `<div class="pad"><h3>Audit Trail</h3><div class="card"><table class="incard"><thead><tr><th>Time</th><th>Item</th><th>Change</th><th>Note</th></tr></thead><tbody>
    ${stockLog.map(l => `<tr><td>${l.t}</td><td>${l.i}</td><td>${l.c}</td><td>${l.n}</td></tr>`).join('') || '<tr><td colspan="4">No logs yet</td></tr>'}
  </tbody></table></div></div>`;
}

function renderOrders() {
  return `<div class="pad"><h3>Order History</h3>${orders.map(o => `
    <div class="card pad" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between"><strong>INV-${o.id}</strong><span class="badge badge-ok">PROCESSED</span></div>
      <div style="font-size:11px;margin:5px 0">${o.items}</div>
      <strong>Total: ${$d(o.total)}</strong>
    </div>`).join('') || '<p>No orders found.</p>'}</div>`;
}

// LOGIC: CART & FULFILLMENT
function addToCart(id) { cart[id] = (cart[id] || 0) + 1; toast("Added to order"); renderContent('catalogue'); }
function openCart() {
  const items = Object.entries(cart).map(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    return `<div style="display:flex;justify-content:space-between;margin-bottom:10px"><div>${p.name} x ${qty}</div><div>${$d(p.ws_price * qty)}</div></div>`;
  }).join('');
  document.getElementById('cartItems').innerHTML = items || "Order is empty";
  document.getElementById('cartOverlay').style.display = 'flex';
}
function closeCart() { document.getElementById('cartOverlay').style.display = 'none'; }

function submitOrder() {
  let total = 0; let summary = [];
  Object.entries(cart).forEach(([id, qty]) => {
    const p = PRODUCTS.find(x => x.id == id);
    if (p.warehouse_qty >= qty) {
      p.warehouse_qty -= qty; // LIVE STOCK DEDUCTION
      stockLog.unshift({ t: new Date().toLocaleTimeString(), i: p.name, c: `-${qty}`, n: "Customer Order" });
      total += (p.ws_price * qty);
      summary.push(`${p.name} (x${qty})`);
    }
  });
  orders.unshift({ id: Math.floor(Math.random() * 9000), items: summary.join(', '), total: total * 1.15 });
  cart = {};
  closeCart();
  toast("Order Processed & Stock Updated!");
  renderContent('catalogue');
}

function savePrice(id) {
  const p = PRODUCTS.find(x => x.id == id);
  p.ws_price = parseFloat(document.getElementById(`ws-${id}`).value);
  p.rrp = parseFloat(document.getElementById(`rrp-${id}`).value);
  toast("Price Updated");
}

buildNav();
</script>
</body>
</html>
